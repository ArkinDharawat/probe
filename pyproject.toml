[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "probe"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "anthropic>=0.42",
    "mcp>=1.0",
    "sentence-transformers>=3",
    "sqlite-vec>=0.1",
    "numpy>=1.26",
    "pyyaml>=6",
    "pydantic>=2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.4",
]

[project.scripts]
probe = "probe.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/probe"]

[tool.pytest.ini_options]
testpaths = ["tests"]
